[theme]
base = "light"
primaryColor = "#8f293e"
backgroundColor = "#f8f6f2"
secondaryBackgroundColor = "#f0ede7"
textColor = "#292723"
font = "Times New Roman"
headingFont = "Times New Roman"
codeFont = "Times New Roman"
baseFontSize = 18
headingFontSizes = ["2.5rem", "1.85rem", "1.4rem", "1.15rem", "1.05rem", "1rem"]
headingFontWeights = [700, 700, 700, 700, 700, 700]
metricValueFontSize = "1.55rem"
metricValueFontWeight = 700
borderColor = "#ded8cf"
baseRadius = "10px"
buttonRadius = "7px"
showWidgetBorder = true
showSidebarBorder = true
dataframeHeaderBackgroundColor = "#f0ede7"
dataframeHeaderTextColor = "#292723"
paddingTop = "1.4rem"
paddingBottom = "3rem"

[theme.sidebar]
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f6f3ef"
borderColor = "#ded8cf"
textColor = "#292723"
primaryColor = "#8f293e"
paddingTop = "1rem"
paddingBottom = "1.5rem"

[server]
maxUploadSize = 30
headless = false

[browser]
gatherUsageStats = false
