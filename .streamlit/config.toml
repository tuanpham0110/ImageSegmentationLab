[theme]
base = "light"
primaryColor = "#1877f2"
backgroundColor = "#f5f7fb"
secondaryBackgroundColor = "#f0f3f8"
textColor = "#182230"
font = "Arial"
headingFont = "Arial"
codeFont = "Arial"
baseFontSize = 15
headingFontSizes = ["1.9rem", "1.5rem", "1.2rem", "1.05rem", "1rem", "0.9rem"]
headingFontWeights = [700, 700, 600, 600, 600, 600]
metricValueFontSize = "1.35rem"
metricValueFontWeight = 600
borderColor = "#e3e8ef"
baseRadius = "12px"
buttonRadius = "8px"
showWidgetBorder = true
showSidebarBorder = true
dataframeHeaderBackgroundColor = "#f0f3f8"
dataframeHeaderTextColor = "#344054"
paddingTop = "1rem"
paddingBottom = "3rem"

[theme.sidebar]
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f5f7fb"
borderColor = "#e3e8ef"
textColor = "#344054"
primaryColor = "#1877f2"
paddingTop = "0.5rem"
paddingBottom = "1.5rem"

[server]
maxUploadSize = 30
headless = false

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
